plugins {
    id 'com.android.application'
}

android {
    namespace "com.night.backgroundchange"
    compileSdk 34

    defaultConfig {
        applicationId "com.night.backgroundchange"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"

        ndk {
            abiFilters "armeabi-v7a", "arm64-v8a", "x86", "x86_64"
        }
    }

    externalNativeBuild {
        cmake {
            path file("src/main/Cpp/CMakeLists.txt")
            version "3.22.1"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    // Keep this block completely clean to prevent Gradle 9 configuration conflicts
}
