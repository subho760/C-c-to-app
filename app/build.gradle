plugins {
    id 'com.android.application'
    // Any other plugins you have like kotlin-android go here
}

android {
    namespace 'com.night.backgroundchange'
    compileSdk 34 // Or your current compileSdk version

    defaultConfig {
        applicationId "com.night.backgroundchange"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        
        // 🟢 C++ Configuration inside defaultConfig
        externalNativeBuild {
            cmake {
                cppFlags ""
            }
        }
    }

    // 🟢 C++ Configuration linking your CMakeLists file
    externalNativeBuild {
        cmake {
            path file("src/main/cpp/CMakeLists.txt")
            version "3.22.1"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    
    // ... rest of your build.gradle options like compileOptions or dependencies
}
