plugins {
    id 'com.android.application'
}

android {
    namespace 'com.night.backgroundchange'
    compileSdk 34
    ndkVersion "25.1.8937393"

    defaultConfig {
        applicationId "com.night.backgroundchange"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    signingConfigs {
        release {
            storeFile file("../Night_Shadow_Main_Key.jks")
            storePassword System.getenv("KEYSTORE_PASSWORD")
            keyAlias System.getenv("KEY_ALIAS")
            keyPassword System.getenv("KEY_PASSWORD")
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

// 🚀 FIXED: Isolated at the root level completely outside the 'android' block
// This lets Gradle finish the Android asset lifecycle before touching C++ paths
externalNativeBuild {
    cmake {
        path file('src/main/Cpp/CMakeLists.txt')
        version '3.22.1'
    }
}

// Attach the specific flags to the defaultConfig block sequentially via late-binding path extension
android.defaultConfig.externalNativeBuild.cmake {
    cppFlags "-std=c++17"
    arguments "-DANDROID_STL=c++_shared"
}
