plugins {
    id 'com.android.application'
}

android {
    namespace 'com.night.backgroundchange'
    compileSdk 34

    defaultConfig {
        applicationId "com.night.backgroundchange"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    // 1️⃣ Signing Configurations MUST be defined before Build Types
    signingConfigs {
        release {
            storeFile file("../Night_Shadow_Main_Key.jks")
            storePassword System.getenv("KEYSTORE_PASSWORD")
            keyAlias System.getenv("KEY_ALIAS")
            keyPassword System.getenv("KEY_PASSWORD")
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            
            // Safe to attach now that signingConfigs is completely declared above
            signingConfig signingConfigs.release
        }
    }
    
    // 2️⃣ Combined Native Build Block placed safely at the bottom to avoid mutating classpaths
    externalNativeBuild {
        cmake {
            path file('src/main/Cpp/CMakeLists.txt')
            version '3.22.1'
            // Arguments and flags passed to CMake clean and early
            arguments "-DANDROID_STL=c++_shared"
            cppFlags "-std=c++17"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.9.0'
}
