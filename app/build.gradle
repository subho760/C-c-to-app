plugins {
    id 'com.android.application'
}

android {
    namespace "com.night.backgroundchange"
    compileSdk 34

    defaultConfig {
        applicationId "com.night.backgroundchange"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"

        ndk {
            abiFilters "armeabi-v7a", "arm64-v8a", "x86", "x86_64"
        }
    }

    // 🔐 This block reads your workflow secrets to sign the APK
    signingConfigs {
        release {
            storeFile file("Night_Shadow_Main_Key.jks")
            storePassword System.getenv("KEYSTORE_PASSWORD")
            keyAlias System.getenv("KEY_ALIAS")
            keyPassword System.getenv("KEY_PASSWORD")
        }
    }

    externalNativeBuild {
        cmake {
            path file("src/main/Cpp/CMakeLists.txt")
            version "3.22.1"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            // 🚀 Tells Gradle to apply the signing key to your release build
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    // Kept clean to prevent Gradle 9 dependency mutation conflicts
}
