plugins {
    id 'com.android.application'
}

android {
    namespace 'com.night.backgroundchange'
    compileSdk 34
    ndkVersion "25.1.8937393"

    defaultConfig {
        applicationId "com.night.backgroundchange"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    signingConfigs {
        release {
            storeFile file("../Night_Shadow_Main_Key.jks")
            storePassword providers.environmentVariable("KEYSTORE_PASSWORD").orElse("").get()
            keyAlias providers.environmentVariable("KEY_ALIAS").orElse("").get()
            keyPassword providers.environmentVariable("KEY_PASSWORD").orElse("").get()
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.9.0'
}

// 🚀 THE FIX: Isolate the CMake registration completely from the initial configuration phase.
// This prevents AGP 9.x from locking your release compilation classpaths during asset generation.
project.afterEvaluate {
    if (project.plugins.hasPlugin('com.android.application')) {
        android {
            externalNativeBuild {
                cmake {
                    path file('src/main/Cpp/CMakeLists.txt')
                    version '3.22.1'
                }
            }
            defaultConfig {
                externalNativeBuild {
                    cmake {
                        cppFlags "-std=c++17"
                        arguments "-DANDROID_STL=c++_shared"
                    }
                }
            }
        }
    }
}
