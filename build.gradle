buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.2.2'
        classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.22'
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

// Safely configure or create the clean task so it never crashes the build setup
if (tasks.findByName('clean') != null) {
    tasks.named('clean') {
        doLast {
            delete rootProject.layout.buildDirectory
        }
    }
} else {
    tasks.register('clean') {
        doLast {
            delete rootProject.layout.buildDirectory
        }
    }
}
